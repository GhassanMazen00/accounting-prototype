<!--
  Marshmallow — Retail Management System (demonstration build)

<title>Marshmallow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Tajawal:wght@400;500;700&display=swap">
<style>
  /* Layout: RTL app shell — monochrome. Top bar with console/branch switch, tab row, 1320px column.
     No hue anywhere: state is carried by weight, fill and border style, never colour. */
  :root {
    --bg:#f7f7f8; --surface:#ffffff; --surface-2:#f1f1f3; --surface-3:#e6e6ea;
    --ink:#141416; --ink-2:#5c5c63; --ink-3:#8e8e96;
    --line:#e3e3e7; --line-2:#cdcdd3;
    --accent:#141416; --on-accent:#ffffff;
    --shadow:0 1px 2px rgba(20,20,22,.05), 0 4px 14px rgba(20,20,22,.05);
    --radius:12px;
    --font:"Tajawal", system-ui, "Segoe UI", sans-serif;
    --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0e0e10; --surface:#161618; --surface-2:#1e1e21; --surface-3:#2a2a2f;
      --ink:#f2f2f4; --ink-2:#a8a8b0; --ink-3:#74747c;
      --line:#2a2a2e; --line-2:#3c3c43;
      --accent:#f2f2f4; --on-accent:#141416;
      --shadow:0 1px 2px rgba(0,0,0,.45), 0 4px 16px rgba(0,0,0,.4);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg:#0e0e10; --surface:#161618; --surface-2:#1e1e21; --surface-3:#2a2a2f;
    --ink:#f2f2f4; --ink-2:#a8a8b0; --ink-3:#74747c;
    --line:#2a2a2e; --line-2:#3c3c43;
    --accent:#f2f2f4; --on-accent:#141416;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 4px 16px rgba(0,0,0,.4);
    color-scheme: dark;
  }

  * { box-sizing:border-box; }
  body { background:var(--bg); color:var(--ink); font-family:var(--font); direction:rtl;
         font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased; }
  h1,h2,h3,h4 { margin:0; line-height:1.25; font-weight:700; }
  p { margin:0; }
  button { font-family:inherit; font-size:inherit; cursor:pointer; }
  input, select, textarea { font-family:inherit; font-size:14px; }

  .topbar { position:sticky; top:env(safe-area-inset-top,0px); z-index:30;
    background:color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter:saturate(160%) blur(10px);
    border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between;
    gap:14px; flex-wrap:wrap; padding:11px 20px; }
  .brandmark { display:flex; align-items:center; gap:10px; }
  .dot { width:11px; height:11px; border-radius:50%; background:var(--accent); flex:none; }
  .wordmark { font-size:19px; font-weight:700; letter-spacing:-.01em; }
  .chip-demo { font-size:10.5px; font-weight:700; letter-spacing:.06em; background:var(--surface-2);
    color:var(--ink-2); padding:3px 9px; border-radius:999px; border:1px solid var(--line-2); }
  .topright { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .seg { display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:9px; padding:3px; gap:3px; }
  .seg button { border:none; background:none; color:var(--ink-2); padding:6px 14px; border-radius:6px; font-weight:500; font-size:14px; }
  .seg button[aria-pressed="true"] { background:var(--accent); color:var(--on-accent); font-weight:700; }
  select.pick, input.fld, select.fld { padding:7px 11px; border:1px solid var(--line-2); border-radius:8px;
    background:var(--surface); color:var(--ink); }
  input.fld:focus, select.fld:focus, select.pick:focus, .srch:focus { outline:2px solid var(--accent); outline-offset:1px; }
  .iconbtn { border:1px solid var(--line-2); background:var(--surface); color:var(--ink); width:36px; height:36px;
    border-radius:8px; font-size:15px; line-height:1; display:inline-flex; align-items:center; justify-content:center; }

  .tabrow { display:flex; gap:4px; overflow-x:auto; padding:12px 20px 0; border-bottom:1px solid var(--line);
    background:var(--bg); position:sticky; top:calc(env(safe-area-inset-top,0px) + 58px); z-index:20; }
  .tabrow button { border:none; background:none; color:var(--ink-2); white-space:nowrap; padding:9px 15px;
    border-radius:8px 8px 0 0; font-weight:500; font-size:14.5px; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tabrow button:hover { color:var(--ink); background:var(--surface-2); }
  .tabrow button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--accent); font-weight:700; }

  .subnav { display:flex; gap:6px; flex-wrap:wrap; }
  .subnav button { border:1px solid var(--line); background:var(--surface); color:var(--ink-2);
    padding:6px 13px; border-radius:999px; font-size:13.5px; font-weight:500; }
  .subnav button[aria-pressed="true"] { background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:700; }

  .wrap { max-width:1320px; margin-inline:auto; padding-inline:20px; padding-block:24px 64px; }
  .stack { display:flex; flex-direction:column; gap:22px; }
  .stack-s { display:flex; flex-direction:column; gap:12px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  .sechead { display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .sechead h2 { font-size:19px; }
  .sub { color:var(--ink-3); font-size:13.5px; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); }
  .card-pad { padding:18px; }

  .tiles { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:12px; }
  .tile { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:15px 16px;
    display:flex; flex-direction:column; gap:3px; min-width:0; }
  .tile .lbl { font-size:12.5px; color:var(--ink-3); font-weight:500; }
  .tile .val { font-size:23px; font-weight:700; letter-spacing:-.015em; font-variant-numeric:tabular-nums; }
  .tile .meta { font-size:12px; color:var(--ink-3); }

  .tscroll { overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); }
  .tscroll.tall { max-height:560px; overflow-y:auto; }
  table { border-collapse:collapse; width:100%; font-size:14px; }
  th, td { text-align:right; padding:10px 13px; border-bottom:1px solid var(--line); white-space:nowrap; }
  thead th { font-size:12px; font-weight:500; color:var(--ink-3); background:var(--surface-2); position:sticky; top:0; z-index:1; }
  tbody tr:last-child td { border-bottom:none; }
  tbody tr.clickable { cursor:pointer; }
  tbody tr.clickable:hover { background:var(--surface-2); }
  tr.totalrow td { font-weight:700; background:var(--surface-2); }
  .n { font-variant-numeric:tabular-nums; }
  .code { font-family:var(--mono); font-size:12.5px; color:var(--ink-3); direction:ltr; display:inline-block; }

  /* الحالات بالوزن لا باللون */
  .badge { display:inline-block; font-size:12px; font-weight:500; padding:2px 9px; border-radius:999px;
           border:1px solid transparent; }
  .b-quiet { background:var(--surface-2); color:var(--ink-3); }
  .b-mark  { background:var(--surface); color:var(--ink); border-color:var(--line-2); font-weight:700; }
  .b-loud  { background:var(--accent); color:var(--on-accent); font-weight:700; }
  .b-dash  { background:var(--surface); color:var(--ink-2); border:1px dashed var(--line-2); }

  .minibar { height:6px; border-radius:3px; background:var(--surface-3); overflow:hidden; min-width:90px; }
  .minibar i { display:block; height:100%; background:var(--accent); border-radius:3px; }

  .btn { border:1px solid var(--line-2); background:var(--surface); color:var(--ink); padding:9px 15px;
         border-radius:9px; font-weight:500; }
  .btn:hover { background:var(--surface-2); }
  .btn-primary { background:var(--accent); border-color:var(--accent); color:var(--on-accent); font-weight:700; }
  .btn-primary:hover { opacity:.88; }
  .btn:disabled, .btn-primary:disabled { opacity:.4; cursor:not-allowed; }
  .btn-sm { padding:6px 11px; font-size:13.5px; }

  .notice { display:flex; gap:10px; align-items:flex-start; background:var(--surface-2);
    border:1px solid var(--line); border-inline-start:3px solid var(--accent); border-radius:10px;
    border-start-start-radius:0; border-end-start-radius:0;
    padding:12px 15px; font-size:13.5px; color:var(--ink-2); }
  .notice b { color:var(--ink); }

  .chartbox { position:relative; }
  svg.chart { display:block; width:100%; height:auto; direction:ltr; }
  .tip { position:absolute; pointer-events:none; opacity:0; transition:opacity .12s; background:var(--accent);
    color:var(--on-accent); font-size:12.5px; font-weight:500; padding:6px 10px; border-radius:7px;
    white-space:nowrap; transform:translate(-50%,-130%); z-index:5; }
  .tip.on { opacity:1; }

  /* شبكة المقاسات والألوان — تدرّج رمادي للكمية، وإطار متقطّع للصفر */
  .vgrid { border-collapse:separate; border-spacing:3px; }
  .vgrid th { background:none; font-size:12px; color:var(--ink-3); padding:4px 8px; position:static; }
  .vgrid td { border:none; padding:0; }
  .vcell { display:flex; align-items:center; justify-content:center; min-width:52px; height:40px;
    border-radius:8px; font-weight:700; font-variant-numeric:tabular-nums; font-size:14px; border:1px solid var(--line); }
  .vcell.q0 { background:var(--surface); color:var(--ink-3); border:1px dashed var(--line-2); }
  .vcell.q1 { background:var(--surface-2); color:var(--ink-2); }
  .vcell.q2 { background:var(--surface-3); color:var(--ink); }
  .vcell.q3 { background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
  button.vcell:hover:not(:disabled) { outline:2px solid var(--accent); outline-offset:1px; }
  button.vcell:disabled { opacity:.55; cursor:not-allowed; }
  .legend { display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--ink-3); align-items:center; }
  .legend i { display:inline-block; width:12px; height:12px; border-radius:3px; margin-inline-end:5px; vertical-align:-2px; }

  .poswrap { display:grid; grid-template-columns:1fr 340px; gap:18px; align-items:start; }
  @media (max-width:940px){ .poswrap{ grid-template-columns:1fr; } }
  .pgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(168px,1fr)); gap:11px; }
  .pcard { background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:13px;
    text-align:right; display:flex; flex-direction:column; gap:5px; min-width:0; }
  .pcard:hover { border-color:var(--accent); box-shadow:var(--shadow); }
  .pcard .nm { font-weight:700; font-size:14.5px; }
  .pcard .pr { font-weight:700; font-variant-numeric:tabular-nums; font-size:14px; }
  .pcard .av { font-size:11.5px; color:var(--ink-3); }
  .cart { position:sticky; top:132px; display:flex; flex-direction:column; }
  .cart-head { padding:14px 16px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; }
  .cart-items { display:flex; flex-direction:column; max-height:330px; overflow-y:auto; }
  .citem { display:grid; grid-template-columns:1fr auto auto; gap:8px; align-items:center; padding:10px 16px;
    border-bottom:1px solid var(--line); font-size:13.5px; }
  .citem .cn b { display:block; font-size:13.5px; }
  .citem .cn span { color:var(--ink-3); font-size:11.5px; }
  .xbtn { border:none; background:none; color:var(--ink-3); font-size:16px; padding:0 4px; line-height:1; }
  .xbtn:hover { color:var(--ink); }
  .cart-foot { padding:14px 16px; display:flex; flex-direction:column; gap:10px; }
  .ttl { display:flex; justify-content:space-between; font-size:13.5px; color:var(--ink-2); }
  .ttl.grand { font-size:18px; font-weight:700; color:var(--ink); padding-top:9px; border-top:1px solid var(--line); }
  .empty { padding:30px 16px; text-align:center; color:var(--ink-3); font-size:13.5px; }

  .ovl { position:fixed; inset:0; background:rgba(10,10,12,.55); display:flex; align-items:center;
    justify-content:center; padding:20px; z-index:50; }
  .modal { background:var(--surface); border:1px solid var(--line); border-radius:14px; max-width:740px; width:100%;
    max-height:88vh; overflow-y:auto; box-shadow:0 24px 60px rgba(0,0,0,.35); }
  .modal.wide { max-width:940px; }
  .modal-h { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:16px 18px;
    border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--surface); z-index:2; }
  .modal-b { padding:18px; display:flex; flex-direction:column; gap:16px; }

  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--accent);
    color:var(--on-accent); padding:11px 22px; border-radius:999px; font-weight:700; font-size:14px;
    z-index:60; box-shadow:0 8px 24px rgba(0,0,0,.3); }

  .srch { padding:9px 13px; border:1px solid var(--line-2); border-radius:9px; background:var(--surface);
    color:var(--ink); min-width:180px; }
  .backlink { border:none; background:none; color:var(--ink); font-weight:700; padding:0; font-size:14px; text-decoration:underline; text-underline-offset:3px; }

  /* ختم حقوق الملكية — زاوية ثابتة، باهت ولا يعترض أي ضغطة */
  .copyright {
    position: fixed; left: 14px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
    z-index: 5; pointer-events: none;
    font-size: 10.5px; line-height: 1.5; letter-spacing: .04em;
    color: var(--ink-3); opacity: .45; text-align: left; direction: ltr;
  }
  .copyright b { font-weight: 600; letter-spacing: .07em; }
  .copyright span { display: block; direction: rtl; letter-spacing: 0; font-size: 9.5px; }
  @media (max-width: 600px) { .copyright { font-size: 9px; opacity: .38; } }
  @media print { .copyright { opacity: .7; } }

  /* صور الأصناف */
  .thumb { width:44px; height:52px; border-radius:7px; object-fit:cover; display:block;
    border:1px solid var(--line); background:var(--surface-2); }
  .thumb-ph { width:44px; height:52px; border-radius:7px; border:1px dashed var(--line-2);
    background:var(--surface-2); display:flex; align-items:center; justify-content:center;
    color:var(--ink-3); font-size:15px; }
  .thumb-lg { width:120px; height:144px; }
  .thumb-ph .gl { width:22px; height:22px; }
  .thumb-ph.thumb-lg .gl { width:48px; height:48px; }
  .pthumb-ph .gl { width:40px; height:40px; }
  .pthumb { width:100%; aspect-ratio:3/4; border-radius:8px; object-fit:cover; display:block;
    border:1px solid var(--line); background:var(--surface-2); margin-bottom:4px; }
  .pthumb-ph { width:100%; aspect-ratio:3/4; border-radius:8px; border:1px dashed var(--line-2);
    background:var(--surface-2); display:flex; align-items:center; justify-content:center;
    color:var(--ink-3); font-size:22px; margin-bottom:4px; }
  .drop { border:1px dashed var(--line-2); border-radius:10px; padding:14px; display:flex;
    gap:14px; align-items:center; background:var(--surface-2); }
  .drop input[type=file] { position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
  label.filebtn { display:inline-block; border:1px solid var(--line-2); background:var(--surface);
    color:var(--ink); padding:7px 14px; border-radius:9px; font-weight:500; font-size:13.5px; cursor:pointer; }
  label.filebtn:hover { background:var(--surface-3); }

  /* الفلاتر */
  .filters { display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; background:var(--surface);
    border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px; }
  .f { display:flex; flex-direction:column; gap:4px; min-width:0; }
  .f label { font-size:11.5px; color:var(--ink-3); font-weight:500; }
  .chips { display:flex; gap:6px; flex-wrap:wrap; }
  .chips button { border:1px solid var(--line-2); background:var(--surface); color:var(--ink-2);
    padding:5px 11px; border-radius:999px; font-size:13px; font-weight:500; }
  .chips button[aria-pressed="true"] { background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:700; }

  /* نموذج */
  .grid2 { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  .fieldset { border:1px solid var(--line); border-radius:10px; padding:14px; display:flex; flex-direction:column; gap:12px; }
  .fieldset > h4 { font-size:13.5px; color:var(--ink-2); font-weight:700; }
  .f-full { display:flex; flex-direction:column; gap:5px; }
  .f-full label { font-size:12.5px; color:var(--ink-2); font-weight:500; }
  .f-full input, .f-full select { width:100%; padding:9px 12px; border:1px solid var(--line-2);
    border-radius:8px; background:var(--surface); color:var(--ink); }
  .hint { font-size:12px; color:var(--ink-3); }
  .jline { display:grid; grid-template-columns:1fr 130px 130px 32px; gap:8px; align-items:center; }
  @media (max-width:700px){ .jline{ grid-template-columns:1fr 1fr; } }
  .balrow { display:flex; justify-content:space-between; gap:12px; font-size:14px; padding:10px 12px;
    background:var(--surface-2); border-radius:8px; font-variant-numeric:tabular-nums; }
  .balrow.bad b { text-decoration:underline; text-decoration-style:wavy; text-underline-offset:3px; }
  @media (prefers-reduced-motion: reduce){ * { transition:none !important; } }
</style>
</head>
<body>


<div class="topbar">
  <div class="brandmark"><span class="dot"></span><span class="wordmark">Marshmallow</span>
    <span class="chip-demo">نسخة تجريبية</span></div>
  <div class="topright">
    <div class="seg" role="group" aria-label="اختيار الواجهة">
      <button id="m-admin" aria-pressed="true">الإدارة الرئيسية</button>
      <button id="m-wh" aria-pressed="false">شاشة المخزن</button>
      <button id="m-acc" aria-pressed="false">شاشة المحاسب</button>
      <button id="m-branch" aria-pressed="false">شاشة الفرع</button>
    </div>
    <select class="pick" id="bpick" hidden aria-label="اختيار الفرع"></select>
    <button class="iconbtn" id="themer" aria-label="تبديل المظهر">◐</button>
  </div>
</div>
<nav class="tabrow" id="tabs" role="tablist"></nav>
<div class="wrap"><div id="view" class="stack"></div></div>
<div id="layer"></div>
<div class="copyright">© 2026 <b>Ghassan Mazen</b><span>جميع الحقوق محفوظة</span></div>

<script>
/* ============================================================
   بيانات تجريبية ثابتة — وهمية بالكامل
   ============================================================ */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R = mulberry32(72026);
const ri=(a,b)=>a+Math.floor(R()*(b-a+1));
const pick=a=>a[Math.floor(R()*a.length)];
const r5=n=>Math.round(n/5)*5;

const AR  = n => (Math.round(Number(n)||0)).toLocaleString('ar-EG');
const EGP = n => AR(n)+' ج.م';
const KEGP= n => n>=1e6 ? AR(Math.round(n/1e5)/10)+' م' : n>=1000 ? AR(Math.round(n/1000))+' ألف' : AR(n);
const arD = s => String(s).replace(/[0-9]/g, d=>'٠١٢٣٤٥٦٧٨٩'[d]);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function mkMove(bid,dt,kind,s,sz,cl,qty,extra){

    at:dt, bid, kind, code:s.code, name:s.name, size:sz, color:cl, qty,

    by: (BRANCHES.find(b=>b.id===bid)||{}).manager || '—' };
  Object.assign(m, extra||{}); MOVES.push(m); return m;
}

function je(date, desc, lines, src){
  const dr = lines.reduce((a,l)=>a+(l.dr||0),0), cr = lines.reduce((a,l)=>a+(l.cr||0),0);
  if (Math.abs(dr-cr) > 0.5) { const diff = Math.round(dr-cr);
    lines.push(diff>0 ? {acc:'3110',dr:0,cr:diff} : {acc:'3110',dr:-diff,cr:0}); }
  JOURNAL.push({ id:'JV-'+String(++jSeq).padStart(4,'0'), date, desc, src: src||'تلقائي',
                 lines: lines.map(l=>({acc:l.acc, dr:Math.round(l.dr||0), cr:Math.round(l.cr||0)})) });
}

const jLines = () => JOURNAL.flatMap(j=>j.lines.map(l=>({...l, j})));
function accBal(code){
  let dr=0, cr=0;
  JOURNAL.forEach(j=>j.lines.forEach(l=>{ if(l.acc===code){ dr+=l.dr; cr+=l.cr; } }));
  return { dr, cr, bal: dr-cr };
}
function trialBalance(){
  return COA.map(a=>{ const b=accBal(a.code); return {...a, dr:b.dr, cr:b.cr,
    netDr: b.bal>0?b.bal:0, netCr: b.bal<0?-b.bal:0 }; }).filter(r=>r.dr||r.cr);
}
const sumType = t => COA.filter(a=>a.type===t).reduce((s,a)=>s+Math.abs(accBal(a.code).bal),0);
function pnl(){
  const rev = Math.abs(accBal('4110').bal), retn = Math.abs(accBal('4120').bal);
  const cogs= Math.abs(accBal('5110').bal);
  const ops = COA.filter(a=>a.type==='expense' && a.code!=='5110')
                 .map(a=>({...a, amt:Math.abs(accBal(a.code).bal)}));
  const opex= ops.reduce((s,o)=>s+o.amt,0);
  const net = rev-retn-cogs-opex;
  return { rev, retn, netRev:rev-retn, cogs, gross:rev-retn-cogs, ops, opex, net };
}
function balanceSheet(){
  const P = pnl();
  /* أرصدة مُوقَّعة: الأصول موجبة بالمدين، والخصوم وحقوق الملكية موجبة بالدائن.
     ما دام كل قيد متوازناً فإن الطرفين يتساويان حسابياً بالضرورة. */
  const g = n => COA.filter(a=>a.group===n).map(a=>({...a, amt:accBal(a.code).bal})).filter(a=>Math.abs(a.amt)>0.5);
  const ca = g('الأصول المتداولة'), fa = g('الأصول الثابتة');
  const li = g('الخصوم المتداولة').map(a=>({...a, amt:-a.amt}));
  const eq = g('حقوق الملكية').map(a=>({...a, amt:-a.amt}));
  const assets = [...ca,...fa].reduce((s,a)=>s+a.amt,0);
  const liab   = li.reduce((s,a)=>s+a.amt,0);
  const equity = eq.reduce((s,a)=>s+a.amt,0) + P.net;
  return { ca, fa, li, eq, assets, liab, equity, net:P.net, total: liab+equity };
}

  S.mode=m; S.profile=null; S.q=''; S.sq=''; S.ledger=null; S.WF=null; S.NI=null; S.JE=null;
  S.tab = m==='admin'?'dash' : m==='branch'?'sell' : m==='wh'?'items' : 'over';
  if(m==='wh') S.whview='items';
  if(m==='acc') S.accview='over';
  MODES.forEach(k=> $('#m-'+k).setAttribute('aria-pressed', m===k));
  $('#bpick').hidden = m!=='branch';
  render();
}
MODES.forEach(k=> $('#m-'+k).onclick=()=>setMode(k));
$('#bpick').innerHTML = BRANCHES.map(b=>`<option value="${b.id}">فرع ${esc(b.name)}</option>`).join('');
$('#bpick').onchange = e=>{ S.branch=+e.target.value; S.cart=[]; render(); };
$('#themer').onclick = ()=>{ const c=document.documentElement.getAttribute('data-theme');
  const dark = c ? c==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.setAttribute('data-theme', dark?'light':'dark'); render(); };

function tabList(){ return S.mode==='admin'?ADMIN_TABS : S.mode==='branch'?BRANCH_TABS
                        : S.mode==='wh'?WH_VIEWS : ACC_VIEWS; }
function curTab(){ return S.mode==='wh'?S.whview : S.mode==='acc'?S.accview : S.tab; }
function setTab(k){ if(S.mode==='wh') S.whview=k; else if(S.mode==='acc') S.accview=k; else S.tab=k; }
function renderTabs(){
  $('#tabs').innerHTML = tabList().map(([k,l])=>
    `<button role="tab" data-t="${k}" aria-selected="${curTab()===k&&!S.profile&&!S.ledger}">${l}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=> b.onclick=()=>{
    setTab(b.dataset.t); S.profile=null; S.q=''; S.ledger=null; render(); });
}
const roBanner = n => `<div class="notice"><span>👁️</span><div>أنت في <b>الإدارة الرئيسية</b>: شاشة ${n} معروضة هنا <b>للاطّلاع فقط</b>. الإضافة والتعديل تتمّان من شاشة ${n} المستقلّة في أعلى الصفحة.</div></div>`;
const whSubnav  = () => `<div class="subnav" role="group">${WH_VIEWS.map(([k,l])=>
  `<button data-wv="${k}" aria-pressed="${S.whview===k}">${l}</button>`).join('')}</div>`;
const accSubnav = () => `<div class="subnav" role="group">${ACC_VIEWS.map(([k,l])=>
  `<button data-av="${k}" aria-pressed="${S.accview===k&&!S.ledger}">${l}</button>`).join('')}</div>`;
function whBody(){ return ({items:whItems, grn:whGRN, trf:whTRF, adj:whADJ})[S.whview](); }
function accBody(){ if(S.ledger) return ledgerPanel(S.ledger);
  return ({over:accOver, open:accOpen, dx:accDX, dues:accDues, coa:accCOA, je:accJE,
           tb:accTB, is:accIS, bs:accBS})[S.accview](); }
const repSubnav = () => `<div class="subnav" role="group">${REP_VIEWS.map(([k,l])=>
  `<button data-rv="${k}" aria-pressed="${S.repview===k}">${l}</button>`).join('')}</div>`;
function repBody(){ return ({ship:repShip, sr:repSR, stmt:repStmt, find:repFind})[S.repview](); }
function render(){
  renderTabs();
  const v=$('#view');
  if (S.mode==='admin'){
    if (S.profile)          v.innerHTML = viewProfile(S.profile);
    else if (S.tab==='wh')  v.innerHTML = roBanner('المخزن')   + whSubnav()  + whBody();
    else if (S.tab==='acc') v.innerHTML = roBanner('الحسابات') + accSubnav() + accBody();
    else if (S.tab==='rep') v.innerHTML = repSubnav() + repBody();
    else                    v.innerHTML = ({dash:viewDash, branches:viewBranches})[S.tab]();
  }
  else if (S.mode==='branch') v.innerHTML = ({sell:viewSell,bstock:viewBStock,rets:viewRets,log:viewLog})[S.tab]();
  else if (S.mode==='wh')     v.innerHTML = whBody();
  else                        v.innerHTML = accBody();
  wire(); bindChart();
}

/* ---------- الرسم البياني ---------- */
function barChart(series, opts){
  opts=opts||{}; const W=760,H=opts.h||210,padT=16,padB=26,padS=56;
  const max=Math.max(...series.map(d=>d.total),1), nice=Math.ceil(max/50000)*50000||max;
  const pw=W-padS-10, ph=H-padT-padB, bw=Math.max(3,pw/series.length-2);
  const grid=[0,.5,1].map(f=>{ const y=padT+ph-ph*f;
    return `<line x1="${padS}" y1="${y.toFixed(1)}" x2="${W-10}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>
      <text x="${padS-8}" y="${(y+4).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--ink-3)">${KEGP(nice*f)}</text>`;}).join('');
  const bars=series.map((d,i)=>{ const h=Math.max(1,(d.total/nice)*ph), x=padS+i*(pw/series.length)+1,
    y=padT+ph-h, r=Math.min(4,bw/2,h);
    return `<path d="M${x.toFixed(1)},${(y+h).toFixed(1)} L${x.toFixed(1)},${(y+r).toFixed(1)} Q${x.toFixed(1)},${y.toFixed(1)} ${(x+r).toFixed(1)},${y.toFixed(1)} L${(x+bw-r).toFixed(1)},${y.toFixed(1)} Q${(x+bw).toFixed(1)},${y.toFixed(1)} ${(x+bw).toFixed(1)},${(y+r).toFixed(1)} L${(x+bw).toFixed(1)},${(y+h).toFixed(1)} Z" fill="var(--accent)" class="bar" data-v="${d.total}" data-d="${dm(d.d)}"/>`;}).join('');
  const step=Math.ceil(series.length/6);
  const xl=series.map((d,i)=> i%step===0?`<text x="${(padS+i*(pw/series.length)+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="var(--ink-3)">${dm(d.d)}</text>`:'').join('');
  return `<div class="chartbox"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'المبيعات اليومية')}">
    ${grid}<line x1="${padS}" y1="${padT+ph}" x2="${W-10}" y2="${padT+ph}" stroke="var(--line-2)" stroke-width="1"/>
    ${bars}${xl}</svg><div class="tip"></div></div>`;
}
function bindChart(){
  const box=document.querySelector('.chartbox'); if(!box) return;
  const tip=box.querySelector('.tip');
  box.querySelectorAll('.bar').forEach(b=>{
    b.addEventListener('mouseenter',()=>{ const r=b.getBoundingClientRect(), br=box.getBoundingClientRect();
      tip.textContent=b.dataset.d+' · '+EGP(b.dataset.v);
      tip.style.left=(r.left-br.left+r.width/2)+'px'; tip.style.top=(r.top-br.top)+'px'; tip.classList.add('on'); });
    b.addEventListener('mouseleave',()=>tip.classList.remove('on'));
  });
}

  const F=S.F, from=new Date(F.from+'T00:00:00'), to=new Date(F.to+'T23:59:59');
  const q=F.q.trim();
  return MOVES.filter(m=>
    m.at>=from && m.at<=to &&
    (F.branch==='all' || m.bid===+F.branch) &&
    F.types[m.kind] &&
    (!q || m.name.includes(q) || m.id.includes(q) || m.code.includes(q) || brName(m.bid).includes(q))
  );
}

/* ---------- استيراد أصناف من ملف ---------- */
const IMP_COLS = 'الاسم,التصنيف,الموسم,التكلفة,السعر,المقاسات,الألوان';
const IMP_SAMPLE = IMP_COLS + '\n' +
  'فستان شيفون طويل,فساتين,صيف ٢٠٢٦,520,1490,S|M|L|XL,أسود|بيج|وردي\n' +
  'بلوزة ساتان,بلوزات,ربيع ٢٠٢٦,310,890,S|M|L,أبيض|أسود\n' +
  'بنطلون كتان,بناطيل,صيف ٢٠٢٦,400,1150,M|L|XL,بيج|كحلي\n' +
  'كارديجان قطن,تريكو,شتاء ٢٠٢٥,480,1320,S|M|L|XL,نبيتي|زيتي';
function parseImport(text){
  const lines = text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return [];
  const start = lines[0].includes('الاسم') ? 1 : 0;
  return lines.slice(start).map((ln,i)=>{
    const c = ln.split(',').map(x=>x.trim());
    const sizes  = (c[5]||'').split('|').map(x=>x.trim()).filter(x=>SIZECODE[x]);
    const colors = (c[6]||'').split('|').map(x=>x.trim()).filter(x=>PALETTE.includes(x));
    const cost=+c[3], price=+c[4];
    const errs=[];
    if(!c[0]) errs.push('بلا اسم');
    if(!CATS.includes(c[1])) errs.push('تصنيف غير معروف');
    if(!(cost>0)) errs.push('تكلفة غير صحيحة');
    if(!(price>cost)) errs.push('السعر يجب أن يتجاوز التكلفة');
    if(!sizes.length) errs.push('بلا مقاسات');
    if(!colors.length) errs.push('بلا ألوان صالحة');
    return { row:i+1, name:c[0]||'', cat:c[1]||'', season:CATS.includes(c[1])?(SEASONS.includes(c[2])?c[2]:SEASONS[0]):'',
             cost, price, sizes, colors, errs, vars:sizes.length*colors.length };
  });
}
function importForm(){
  S.IMP = S.IMP || { text:'' };
  const rows = parseImport(S.IMP.text);
  const ok = rows.filter(r=>!r.errs.length), bad = rows.filter(r=>r.errs.length);
  const vars = ok.reduce((a,r)=>a+r.vars,0);
  return `<p class="sub">الصق الصفوف أو اختر ملف CSV. كل سطر صنف واحد، والمقاسات والألوان مفصولة بعلامة <span class="code">|</span>.</p>
  <div class="fieldset"><h4>الأعمدة المطلوبة</h4>
    <p class="code" style="white-space:normal; direction:rtl">${esc(IMP_COLS)}</p>
    <div class="row" style="gap:8px">
      <label class="filebtn" for="imp-file">اختيار ملف CSV…</label>
      <input type="file" id="imp-file" accept=".csv,text/csv,text/plain">
      <button class="btn btn-sm" id="imp-sample">تعبئة بمثال</button>
      ${ S.IMP.text ? '<button class="btn btn-sm" id="imp-clear">مسح</button>' : '' }
    </div>
    <textarea id="imp-text" rows="6" placeholder="${esc(IMP_COLS)}"
      style="width:100%; padding:10px 12px; border:1px solid var(--line-2); border-radius:8px;
      background:var(--surface); color:var(--ink); font-family:var(--mono); font-size:12.5px;
      direction:rtl; resize:vertical">${esc(S.IMP.text)}</textarea>
  </div>
  ${ rows.length ? `<div class="fieldset"><h4>المعاينة</h4>
    <div class="row" style="gap:10px">
      <span class="badge b-quiet">${AR(ok.length)} صنف جاهز</span>
      ${ bad.length ? `<span class="badge b-loud">${AR(bad.length)} صف به خطأ</span>` : '' }
      <span class="sub">سيُنشأ ${AR(vars)} متغيّر بأكواد وباركود</span>
    </div>
    <div class="tscroll" style="max-height:300px; overflow-y:auto"><table>
      <thead><tr><th>#</th><th>الاسم</th><th>التصنيف</th><th>التكلفة</th><th>البيع</th><th>متغيّرات</th><th>الحالة</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td class="n sub">${AR(r.row)}</td>
        <td style="font-weight:${r.errs.length?'400':'700'}">${esc(r.name)||'—'}</td>
        <td class="sub">${esc(r.cat)||'—'}</td>
        <td class="n sub">${r.cost>0?EGP(r.cost):'—'}</td><td class="n">${r.price>0?EGP(r.price):'—'}</td>
        <td class="n">${r.errs.length?'—':AR(r.vars)}</td>
        <td>${ r.errs.length ? `<span class="badge b-loud">${esc(r.errs[0])}</span>`
                             : '<span class="badge b-quiet">جاهز</span>' }</td></tr>`).join('')}
      </tbody></table></div></div>` : '' }
  <div class="row" style="justify-content:flex-end"><button class="btn" id="imp-cancel">إلغاء</button>
    <button class="btn btn-primary" id="imp-go" ${ok.length?'':'disabled'}>استيراد ${AR(ok.length)} صنف</button></div>`;
}
function openImport(){ S.IMP={text:''}; openModal('استيراد أصناف من ملف', importForm()); wireImport(); }
function wireImport(){
  const re=(keepCaret)=>{ const ta=$('#imp-text'); const pos = ta?ta.selectionStart:null;
    $('#modal-body').innerHTML=importForm(); wireImport();
    if(keepCaret){ const n=$('#imp-text'); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(e){} } } };
  const ta=$('#imp-text'); if(ta) ta.oninput=e=>{ S.IMP.text=e.target.value; re(true); };
  const sm=$('#imp-sample'); if(sm) sm.onclick=()=>{ S.IMP.text=IMP_SAMPLE; re(); };
  const cl=$('#imp-clear'); if(cl) cl.onclick=()=>{ S.IMP.text=''; re(); };
  const f=$('#imp-file'); if(f) f.onchange=e=>{ const file=e.target.files && e.target.files[0]; if(!file) return;
    const fr=new FileReader(); fr.onload=()=>{ S.IMP.text=String(fr.result||''); re(); };
    fr.onerror=()=>toast('تعذّرت قراءة الملف'); fr.readAsText(file,'utf-8'); };
  const c=$('#imp-cancel'); if(c) c.onclick=()=>{ S.IMP=null; $('#layer').innerHTML=''; };
  const go=$('#imp-go'); if(go) go.onclick=()=>{
    const ok = parseImport(S.IMP.text).filter(r=>!r.errs.length);
    let nv=0;
    ok.forEach(r=>{
      const st={ code:'MRS-'+(++styleSeq), name:r.name, price:r.price, cat:r.cat, cost:r.cost,
        colors:r.colors.slice(), sizes:r.sizes.slice(), season:r.season, reorder:50,
        supplier:SUPPLIERS[0], depth:1, img:null, bmode:'auto' };
      STYLES.push(st); nv += st.colors.length*st.sizes.length;
      [{id:WH_ID}, ...BRANCHES].forEach(b=>{ const m={};
        st.colors.forEach(cl2=> st.sizes.forEach(sz=>{ m[vkey(sz,cl2)]=0; })); STOCK[b.id][st.code]=m; });
    });
    S.IMP=null; $('#layer').innerHTML=''; render();
    toast('تم استيراد '+AR(ok.length)+' صنف · '+AR(nv)+' متغيّر');
  };
}

const WF_META = { grn:['إذن توريد جديد',grnForm], trf:['تحويل جديد',trfForm], adj:['جرد وتسوية',adjForm] };
function openWF(kind){ wfInit(kind); openModal(WF_META[kind][0], WF_META[kind][1]()); wireWF(); }
function wireWF(){
  const W=S.WF; if(!W) return;
  const re=(sel,caret)=>{ $('#modal-body').innerHTML=WF_META[W.kind][1](); wireWF();
    if(!sel) return; let el=null; try{ el=document.querySelector(sel); }catch(e){}
    if(el){ el.focus(); if(caret!=null&&el.setSelectionRange){ try{el.setSelectionRange(caret,caret);}catch(e){} } } };
  const bind=(id,key,isNum)=>{ const el=$('#'+id); if(!el) return;
    el.onchange=e=>{ W[key]= isNum? e.target.value : e.target.value; re(); }; };
  bind('w-sup','supplier'); bind('w-to','to'); bind('w-from','from'); bind('w-loc','loc');
  bind('w-size','size'); bind('w-color','color');
  const cd=$('#w-code'); if(cd) cd.onchange=e=>{ W.code=e.target.value; const s=styleBy(W.code);
    if(!s.sizes.includes(W.size)) W.size=s.sizes[0];
    if(!s.colors.includes(W.color)) W.color=s.colors[0];
    W.counted={}; re(); };
  const qn=$('#w-qty'); if(qn) qn.oninput=e=>{ W.qty=e.target.value; re('#w-qty', e.target.selectionStart); };
  document.querySelectorAll('[data-cnt]').forEach(el=> el.oninput=e=>{
    W.counted[el.dataset.cnt]=e.target.value; re('[data-cnt="'+el.dataset.cnt+'"]', e.target.selectionStart); });
  const c=$('#w-cancel'); if(c) c.onclick=()=>{ S.WF=null; $('#layer').innerHTML=''; };
  const sv=$('#w-save'); if(sv) sv.onclick=()=>{
    const s=styleBy(W.code), n=+W.qty||0, now=new Date();
    const add=(loc,code,sz,cl,d)=>{ const m=STOCK[+loc][code]; m[vkey(sz,cl)]=Math.max(0,(m[vkey(sz,cl)]||0)+d); };
    if (W.kind==='grn'){
      add(W.to,W.code,W.size,W.color,n);
      MOVES.unshift({ id:'GRN-'+String(+W.to).padStart(2,'0')+'-'+(++mSeq), at:now, bid:+W.to, kind:'receipt',
        code:s.code, name:s.name, size:W.size, color:W.color, qty:n, value:n*s.cost,
        supplier:W.supplier, by:'أمين المخزن' });
      toast('تم ترحيل إذن التوريد · '+AR(n)+' قطعة إلى '+locName(W.to));
    } else if (W.kind==='trf'){
      add(W.from,W.code,W.size,W.color,-n); add(W.to,W.code,W.size,W.color,n);
      MOVES.unshift({ id:'TRF-'+String(+W.from).padStart(2,'0')+'-'+(++mSeq), at:now, bid:+W.from, kind:'transfer',
        code:s.code, name:s.name, size:W.size, color:W.color, qty:n, value:n*s.cost,
        from:+W.from, to:+W.to, by:'أمين المخزن' });
      toast('تم التحويل · '+AR(n)+' قطعة من '+locName(W.from)+' إلى '+locName(W.to));
    } else {
      let k=0;
      Object.entries(W.counted).forEach(([key,v])=>{ if(v==='') return;
        const [sz,cl]=key.split('|'); const book=qtyAt(W.loc,W.code,sz,cl), cnt=+v;
        if(cnt===book) return;
        STOCK[+W.loc][W.code][key]=cnt; k++;
        MOVES.unshift({ id:'ADJ-'+String(+W.loc).padStart(2,'0')+'-'+(++mSeq), at:now, bid:+W.loc, kind:'count',
          code:s.code, name:s.name, size:sz, color:cl, qty:Math.abs(cnt-book),
          value:Math.abs(cnt-book)*s.cost, reason: cnt>book?'زيادة جرد':'عجز جرد', by:'أمين المخزن' });
      });
      toast('تم ترحيل '+AR(k)+' فرق جرد');
    }
    S.WF=null; $('#layer').innerHTML=''; render();
  };
}

function openNewItem(fromCode){
  if (fromCode){ const o=styleBy(fromCode);
    S.NI = { name:o.name+' — نسخة', cat:o.cat, season:o.season, cost:o.cost, price:o.price,
             reorder:o.reorder, supplier:o.supplier, colors:o.colors.slice(), sizes:o.sizes.slice(),
             img:o.img||null, bmode:o.bmode||'auto' }; }
  openModal(fromCode?'نسخ صنف':'صنف جديد', newItemForm(), true);
  wireNewItem();
}
function wireNewItem(){
  const N=S.NI; if(!N) return;
  const re = (focusId, caret) => { $('#modal-body').innerHTML = newItemForm(); wireNewItem();
    if(focusId){ const el=$('#'+focusId); if(el){ el.focus(); if(caret!=null && el.setSelectionRange){ try{el.setSelectionRange(caret,caret);}catch(e){} } } } };
  const bindTxt = (id, key, num) => { const el=$('#'+id); if(!el) return;
    el.oninput = e => { N[key] = num ? e.target.value : e.target.value; re(id, e.target.selectionStart); }; };
  bindTxt('n-name','name'); bindTxt('n-cost','cost',1); bindTxt('n-price','price',1); bindTxt('n-re','reorder',1);
  ['n-cat','n-season','n-sup'].forEach((id,i)=>{ const el=$('#'+id); if(el) el.onchange=e=>{
    const key=['cat','season','supplier'][i]; N[key]=e.target.value;
    if(key==='cat' && CAT_TPL[N.cat]){ N.sizes=CAT_TPL[N.cat].sizes.slice(); N.colors=CAT_TPL[N.cat].colors.slice(); }
    re(); }; });
  const tpl=$('#n-tpl'); if(tpl) tpl.onclick=()=>{ const t=CAT_TPL[N.cat];
    if(t){ N.sizes=t.sizes.slice(); N.colors=t.colors.slice(); } re(); };
  document.querySelectorAll('[data-bm]').forEach(b=> b.onclick=()=>{ N.bmode=b.dataset.bm; re(); });
  document.querySelectorAll('[data-nsz]').forEach(b=> b.onclick=()=>{ const z=b.dataset.nsz;
    N.sizes.includes(z) ? N.sizes.splice(N.sizes.indexOf(z),1) : N.sizes.push(z);
    N.sizes.sort((a,b)=>['S','M','L','XL','XXL'].indexOf(a)-['S','M','L','XL','XXL'].indexOf(b)); re(); });
  document.querySelectorAll('[data-ncl]').forEach(b=> b.onclick=()=>{ const c=b.dataset.ncl;
    N.colors.includes(c) ? N.colors.splice(N.colors.indexOf(c),1) : N.colors.push(c); re(); });
  const fi=$('#n-img'); if(fi) fi.onchange=e=>{ const f=e.target.files && e.target.files[0];
    readImage(f, d=>{ N.img=d; N.imgName = d && f ? f.name : null; re();
      if(!d && f) toast('تعذّر قراءة الصورة — جرّب صورة أخرى'); }); };
  const fx=$('#n-img-x'); if(fx) fx.onclick=()=>{ N.img=null; N.imgName=null; re(); };
  const cancel=$('#n-cancel'); if(cancel) cancel.onclick=()=>{ S.NI=null; $('#layer').innerHTML=''; };
  const save=$('#n-save'); if(save) save.onclick=()=>{
    const s = { code:'MRS-'+(++styleSeq), name:N.name.trim(), price:+N.price, cat:N.cat, cost:+N.cost,
      colors:N.colors.slice(), sizes:N.sizes.slice(), season:N.season, reorder:+N.reorder||50,
      supplier:N.supplier, depth:1, img:N.img, bmode:N.bmode };
    STYLES.push(s);
    [{id:WH_ID}, ...BRANCHES].forEach(b=>{ const m={};
      s.colors.forEach(cl=> s.sizes.forEach(sz=>{ m[vkey(sz,cl)]=0; }));
      STOCK[b.id][s.code]=m; });
    const n = s.colors.length*s.sizes.length;
    S.NI=null; $('#layer').innerHTML=''; render();
    toast('تم حفظ «'+s.name+'» وإنشاء '+AR(n)+' متغيّر');
  };
}

function wireJE(){

    if(!sel) return;
    let el=null; try{ el=document.querySelector(sel); }catch(e){ el=null; }
    if(el){ el.focus(); if(caret!=null&&el.setSelectionRange){ try{el.setSelectionRange(caret,caret);}catch(e){} } } };
  const d=$('#j-date'); if(d) d.onchange=e=>{ J.date=e.target.value; re(); };
  const ds=$('#j-desc'); if(ds) ds.oninput=e=>{ J.desc=e.target.value; re('#j-desc', e.target.selectionStart); };
  document.querySelectorAll('[data-jacc]').forEach(el=> el.onchange=e=>{ J.lines[+el.dataset.jacc].acc=e.target.value; re(); });
  document.querySelectorAll('[data-jdr]').forEach(el=> el.oninput=e=>{ const i=+el.dataset.jdr;
    J.lines[i].dr=e.target.value; if(e.target.value) J.lines[i].cr=''; re('[data-jdr="'+i+'"]'); });
  document.querySelectorAll('[data-jcr]').forEach(el=> el.oninput=e=>{ const i=+el.dataset.jcr;
    J.lines[i].cr=e.target.value; if(e.target.value) J.lines[i].dr=''; re('[data-jcr="'+i+'"]'); });
  document.querySelectorAll('[data-jrm]').forEach(el=> el.onclick=()=>{ if(J.lines.length<=2) return;

  const c=$('#j-cancel'); if(c) c.onclick=()=>{ S.JE=null; $('#layer').innerHTML=''; };

/* ٢ — تقرير المبيعات والمرتجعات */
function repSR(){
  const [f,t]=rfRange();
  const inR = m => m.at>=f && m.at<=t && (S.RF.branch==='all' || m.bid===+S.RF.branch);
  const rows = BRANCHES.filter(b=> S.RF.branch==='all' || b.id===+S.RF.branch).map(b=>{
    const sa = MOVES.filter(m=>m.kind==='sale' && m.bid===b.id && inR(m));
    const re = MOVES.filter(m=>m.kind==='return' && m.bid===b.id && inR(m));
    const sv = sa.reduce((a,m)=>a+m.value,0), rv = re.reduce((a,m)=>a+m.value,0);
    return { b, sn:sa.length, sv, rn:re.length, rv, net:sv-rv, rate: sv? rv/sv*100 : 0 };
  }).sort((a,b)=>b.sv-a.sv);
  const T = rows.reduce((a,r)=>({sn:a.sn+r.sn,sv:a.sv+r.sv,rn:a.rn+r.rn,rv:a.rv+r.rv,net:a.net+r.net}),
                        {sn:0,sv:0,rn:0,rv:0,net:0});
  const worst = rows.slice().sort((a,b)=>b.rate-a.rate)[0];
  const maxSv = Math.max(...rows.map(r=>r.sv), 1);
  return `<div class="sechead"><div><h2>المبيعات والمرتجعات</h2>
    <span class="sub">لكل فرع خلال الفترة المحددة</span></div></div>
  ${rfBar(true)}
  <div class="tiles">
    <div class="tile"><span class="lbl">إجمالي المبيعات</span><span class="val">${EGP(T.sv)}</span><span class="meta">${AR(T.sn)} فاتورة</span></div>
    <div class="tile"><span class="lbl">إجمالي المرتجعات</span><span class="val">${EGP(T.rv)}</span><span class="meta">${AR(T.rn)} مرتجع</span></div>
    <div class="tile"><span class="lbl">صافي المبيعات</span><span class="val">${EGP(T.net)}</span><span class="meta">—</span></div>
    <div class="tile"><span class="lbl">نسبة المرتجع</span><span class="val">${AR(Math.round(T.sv?T.rv/T.sv*100:0))}٪</span><span class="meta">من المبيعات</span></div>
    <div class="tile"><span class="lbl">أعلى نسبة مرتجع</span><span class="val">${worst?esc(worst.b.name):'—'}</span><span class="meta">${worst?AR(Math.round(worst.rate))+'٪':''}</span></div>
  </div>
  <div class="tscroll tall"><table>
    <thead><tr><th>الفرع</th><th>فواتير</th><th>المبيعات</th><th></th><th>مرتجعات</th><th>قيمة المرتجع</th><th>نسبة المرتجع</th><th>الصافي</th></tr></thead>
    <tbody>${ rows.length ? rows.map(r=>`<tr>
      <td style="font-weight:700">${esc(r.b.name)}</td><td class="n">${AR(r.sn)}</td>
      <td class="n">${EGP(r.sv)}</td>
      <td style="width:110px"><div class="minibar"><i style="width:${(r.sv/maxSv*100).toFixed(1)}%"></i></div></td>
      <td class="n">${AR(r.rn)}</td><td class="n">${EGP(r.rv)}</td>
      <td class="n"><span class="badge ${r.rate>6?'b-loud':r.rate>3?'b-mark':'b-quiet'}">${AR(Math.round(r.rate))}٪</span></td>
      <td class="n" style="font-weight:700">${EGP(r.net)}</td></tr>`).join('')
      : '<tr><td colspan="8" class="empty">لا توجد بيانات.</td></tr>' }
      <tr class="totalrow"><td>الإجمالي</td><td class="n">${AR(T.sn)}</td><td class="n">${EGP(T.sv)}</td><td></td>
        <td class="n">${AR(T.rn)}</td><td class="n">${EGP(T.rv)}</td><td></td><td class="n">${EGP(T.net)}</td></tr>
    </tbody></table></div>`;
}

/* ٣ — كشف حساب مستقل لكل فرع */
function repStmt(){
  const bid = S.RF.branch==='all' ? BRANCHES[0].id : +S.RF.branch;
  const b = BRANCHES.find(x=>x.id===bid);
  const open = OPEN_BR.find(x=>x.id===bid);
  const [f,t]=rfRange();
  const mv = MOVES.filter(m=>m.at>=f && m.at<=t &&
    ((m.bid===bid && ['sale','return','receipt','count'].includes(m.kind)) ||
     (m.kind==='transfer' && (m.to===bid || m.bid===bid))))
    .sort((a,b2)=>a.at-b2.at);
  let run = open.account;
  const lines = mv.map(m=>{
    let desc='', dr=0, cr=0;
    if (m.kind==='transfer' && m.to===bid) { desc='بضاعة واردة من '+locName(m.from!=null?m.from:WH_ID); dr=m.value; }
    else if (m.kind==='transfer')          { desc='بضاعة صادرة إلى '+locName(m.to); cr=m.value; }
    else if (m.kind==='receipt')           { desc='توريد مباشر من '+(m.supplier||'مورّد'); dr=m.value; }
    else if (m.kind==='sale')              { desc='مبيعات محصّلة'; cr=m.value; }
    else if (m.kind==='return')            { desc='مرتجع عميل'; dr=m.value; }
    else                                   { desc='تسوية جرد — '+(m.reason||''); dr=m.value; }
    run += dr-cr;
    return { m, desc, dr, cr, run };
  });
  const tdr = lines.reduce((a,l)=>a+l.dr,0), tcr = lines.reduce((a,l)=>a+l.cr,0);
  return `<div class="sechead"><div><h2>كشف حساب الفرع</h2>
    <span class="sub">حساب جارٍ مستقل لكل فرع مع الإدارة الرئيسية</span></div></div>
  ${rfBar(true)}
  <div class="notice"><span>🧾</span><div>الفرع <b>مدين</b> بما يستلمه من بضاعة وبالمرتجعات، و<b>دائن</b> بما يحصّله من مبيعات ويورّده. ${ S.RF.branch==='all' ? 'يُعرض أول فرع — اختر فرعاً من الفلتر أعلاه.' : '' }</div></div>
  <div class="tiles">
    <div class="tile"><span class="lbl">الفرع</span><span class="val" style="font-size:19px">${esc(b.name)}</span><span class="meta">${esc(b.manager)}</span></div>
    <div class="tile"><span class="lbl">رصيد أول المدة</span><span class="val">${EGP(open.account)}</span><span class="meta">مدين</span></div>
    <div class="tile"><span class="lbl">إجمالي المدين</span><span class="val">${EGP(tdr)}</span><span class="meta">بضاعة ومرتجعات</span></div>
    <div class="tile"><span class="lbl">إجمالي الدائن</span><span class="val">${EGP(tcr)}</span><span class="meta">تحصيلات</span></div>
    <div class="tile"><span class="lbl">الرصيد الختامي</span><span class="val">${EGP(Math.abs(run))}</span><span class="meta">${run>=0?'مدين — على الفرع':'دائن — للفرع'}</span></div>
  </div>
  <div class="tscroll tall"><table>
    <thead><tr><th>المستند</th><th>التاريخ</th><th>البيان</th><th>مدين</th><th>دائن</th><th>الرصيد</th></tr></thead>
    <tbody>
      <tr class="totalrow"><td></td><td class="sub">${dmy(new Date(S.RF.from+'T12:00:00'))}</td>
        <td>رصيد أول المدة</td><td class="n">${EGP(open.account)}</td><td class="n">—</td>
        <td class="n">${EGP(open.account)}</td></tr>
      ${ lines.length ? lines.map(l=>`<tr><td class="code">${l.m.id}</td><td class="sub">${dmy(l.m.at)}</td>
        <td>${esc(l.desc)}</td><td class="n">${l.dr?EGP(l.dr):'—'}</td><td class="n">${l.cr?EGP(l.cr):'—'}</td>
        <td class="n" style="font-weight:700">${EGP(Math.abs(l.run))}</td></tr>`).join('')
        : '<tr><td colspan="6" class="empty">لا توجد حركات في الفترة.</td></tr>' }
      <tr class="totalrow"><td></td><td></td><td>الإجمالي</td><td class="n">${EGP(tdr)}</td>
        <td class="n">${EGP(tcr)}</td><td class="n">${EGP(Math.abs(run))}</td></tr>
    </tbody></table></div>`;
}

          <tbody>${locs.sort((a,b)=>b.q-a.q).map(l=>`<tr><td style="font-weight:${l.id===WH_ID?'700':'400'}">${esc(l.n)}</td>
            <td class="n">${AR(l.q)}</td>

        <div class="sechead"><h2 style="font-size:16px">حسب المقاس واللون — كل المواقع</h2></div>
        ${gridHTML(sel.code, null, false, false)}</div>

    body = `<div class="tscroll tall"><table>

function thumb(s2, big){

  return s2 && s2.img
    ? `<img class="thumb${cls}" src="${s2.img}" alt="${esc(s2.name)}">`
    : `<div class="thumb-ph${cls}" title="لا توجد صورة">${GARMENT}</div>`;
}

                : `<div class="pthumb-ph">${GARMENT}</div>`;

/* تصغير الصورة قبل تخزينها حتى لا تثقل الصفحة */
function readImage(file, cb){
  if(!file || !/^image\//.test(file.type)) { cb(null); return; }
  const fr = new FileReader();
  fr.onload = () => {
    const im = new Image();
    im.onload = () => {
      const max = 420, sc = Math.min(1, max/Math.max(im.width, im.height));
      const c = document.createElement('canvas');
      c.width = Math.round(im.width*sc); c.height = Math.round(im.height*sc);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      try { cb(c.toDataURL('image/jpeg', 0.82)); } catch(e){ cb(fr.result); }
    };
    im.onerror = () => cb(null);
    im.src = fr.result;
  };
  fr.onerror = () => cb(null);
  fr.readAsDataURL(file);
}

  document.querySelectorAll('button[data-p]').forEach(b=> b.onclick=()=>{ const s=styleBy(b.dataset.p);
    openModal(esc(s.name)+' — '+EGP(s.price),
      `<p class="sub">اختر المقاس واللون لإضافته إلى الفاتورة.</p>${gridHTML(s.code,S.branch,true)}`);
    document.querySelectorAll('button[data-add]').forEach(c=> c.onclick=()=>{
      const [code,sz,cl]=c.dataset.add.split('|'), st=styleBy(code);
      const ex=S.cart.find(x=>x.code===code&&x.size===sz&&x.color===cl);
      if(ex) ex.qty++; else S.cart.push({code,name:st.name,size:sz,color:cl,price:st.price,qty:1});
      $('#layer').innerHTML=''; render(); }); });
  document.querySelectorAll('button[data-rm]').forEach(b=> b.onclick=()=>{ S.cart.splice(+b.dataset.rm,1); render(); });
  const pay=$('#pay'); if(pay) pay.onclick=()=>{
    const total=cartTotal(), bid=S.branch, first=S.cart[0];
    S.cart.forEach(c=>{ const m=STOCK[bid][c.code], k=vkey(c.size,c.color); m[k]=Math.max(0,(m[k]||0)-c.qty); });
    MOVES.unshift({ id:'INV-'+String(bid).padStart(2,'0')+'-'+(++mSeq), at:new Date(), bid, kind:'sale',
      code:first.code, name:first.name+(S.cart.length>1?` +${S.cart.length-1}`:''), size:first.size, color:first.color,
      qty:S.cart.reduce((a,c)=>a+c.qty,0), value:total, pay:'كاش',
      by:(BRANCHES.find(b=>b.id===bid)||{}).manager });
    DAILY[bid][DAILY[bid].length-1].total += total;
    S.cart=[]; render(); toast('تم إتمام البيع · '+EGP(total)); };
  const hb=$('#hw-btn'); if(hb) hb.onclick=()=> openModal('ربط الأجهزة بالفرع', hwModal());
  const nr=$('#newret'); if(nr) nr.onclick=()=>{
    openModal('تسجيل مرتجع', `<p class="sub">في النظام الحقيقي يُبحث برقم الفاتورة ثم يُختار الصنف المرتجع.</p>
      <div class="stack-s"><input class="srch" style="max-width:none; width:100%" placeholder="رقم الفاتورة — مثال INV-٠٣-٤١٢٧">
      <div class="row" style="justify-content:flex-end"><button class="btn btn-primary" id="rdone">بحث عن الفاتورة</button></div></div>`);
    $('#rdone').onclick=()=>{ $('#layer').innerHTML=''; toast('نموذج عرض فقط في النسخة التجريبية'); }; };
}

setMode('admin');
</script>

</body>
</html>
